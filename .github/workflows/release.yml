name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a new release for VERSION
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check release channel and tag
        shell: python
        run: |
          import os
          from release_config import VERSION, REPOSITORY
          assert REPOSITORY == os.environ['GITHUB_REPOSITORY'], 'Configure release_config.py first'
          if os.environ['GITHUB_REF_TYPE'] == 'tag':
              assert os.environ['GITHUB_REF_NAME'] == 'v' + VERSION
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install pyinstaller==6.16.0
      - run: python build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: PokerNowAnalyst-Windows
          path: release/*
      - name: Publish complete release
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $releaseTag = python -c "from release_config import VERSION; print('v' + VERSION)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:GITHUB_REF_TYPE -ne 'tag') {
            git tag $releaseTag $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git push origin $releaseTag
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release create $releaseTag release/* --verify-tag --draft --title "PokerNow Analyst $releaseTag" --notes-file RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit $releaseTag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

